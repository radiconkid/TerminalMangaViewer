name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: terma-linux-x86_64
          - os: macos-latest
            artifact_name: terma-macos-x86_64
          - os: windows-latest
            artifact_name: terma-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile terma.py

      - name: Rename artifact
        run: |
          mv dist/terma${{ matrix.os == 'windows-latest' && '.exe' || '' }} dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            terma-linux-x86_64/terma-linux-x86_64
            terma-macos-x86_64/terma-macos-x86_64
            terma-windows-x86_64.exe/terma-windows-x86_64.exe
          generate_release_notes: true
